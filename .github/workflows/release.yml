name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: bun run build
      - name: Smoke test Mac binary and verify architectures
        run: |
          dist/atriveo-engine-darwin-universal --version
          python3 -c 'import subprocess; assert set(subprocess.check_output(["lipo", "-archs", "dist/atriveo-engine-darwin-universal"], text=True).split()) == {"arm64", "x86_64"}' 
          dist/atriveo-engine-darwin-universal companies list
      - name: Checksums
        run: cd dist && shasum -a 256 atriveo-engine-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: atriveo-engine-binaries
          path: dist/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/atriveo-engine-* dist/SHA256SUMS --verify-tag --generate-notes
